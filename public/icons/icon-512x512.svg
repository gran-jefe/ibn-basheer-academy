<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05241d"/>
      <stop offset="50%" stop-color="#094236"/>
      <stop offset="100%" stop-color="#031713"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb4"/>
      <stop offset="35%" stop-color="#d0a63f"/>
      <stop offset="70%" stop-color="#9a741c"/>
      <stop offset="100%" stop-color="#d0a63f"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d0a63f" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d0a63f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d0a63f" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base background (rounded for standard icon, full for maskable) -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner radial glow -->
  <circle cx="256" cy="220" r="180" fill="url(#ambientGlow)"/>

  <!-- Ornate outer gold ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.5"/>

  <!-- Main Center Emblem -->
  <g filter="url(#dropGlow)">
    <!-- 8-Pointed Islamic Star (Rub el Hizb) at top -->
    <g transform="translate(256, 150)">
      <rect x="-30" y="-30" width="60" height="60" fill="url(#goldGrad)" rx="6"/>
      <rect x="-30" y="-30" width="60" height="60" fill="url(#goldGrad)" rx="6" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="16" fill="#094236"/>
      <circle cx="0" cy="0" r="7" fill="url(#goldGrad)"/>
    </g>

    <!-- Open Book / Quran (Rihl) Silhouette in Radiant Gold -->
    <g transform="translate(256, 280)">
      <!-- Left Page -->
      <path d="M -12,35 C -60,15 -120,20 -150,5 C -155,30 -155,75 -150,95 C -120,110 -60,105 -12,125 Z" fill="url(#goldGrad)" opacity="0.95"/>
      <path d="M -16,40 C -60,22 -115,28 -142,16 C -145,35 -145,70 -142,86 C -115,98 -60,94 -16,112 Z" fill="#0b382e"/>
      <!-- Left Page lines (script representation) -->
      <line x1="-125" y1="36" x2="-35" y2="52" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <line x1="-128" y1="52" x2="-35" y2="68" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <line x1="-125" y1="68" x2="-35" y2="84" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

      <!-- Right Page -->
      <path d="M 12,35 C 60,15 120,20 150,5 C 155,30 155,75 150,95 C 120,110 60,105 12,125 Z" fill="url(#goldGrad)" opacity="0.95"/>
      <path d="M 16,40 C 60,22 115,28 142,16 C 145,35 145,70 142,86 C 115,98 60,94 16,112 Z" fill="#0b382e"/>
      <!-- Right Page lines (script representation) -->
      <line x1="35" y1="52" x2="125" y2="36" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <line x1="35" y1="68" x2="128" y2="52" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <line x1="35" y1="84" x2="125" y2="68" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

      <!-- Book Spine / Bookstand (Rihl) -->
      <path d="M -16,35 L 0,22 L 16,35 L 8,145 L 0,140 L -8,145 Z" fill="url(#goldGrad)"/>
      <path d="M -50,135 L 0,110 L 50,135 L 75,170 L 40,170 L 0,135 L -40,170 L -75,170 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Classical Arabic Inscription / Academy Monogram "IB" -->
    <text x="256" y="240" font-family="'Amiri', 'Tajawal', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
      ابن بشير
    </text>
  </g>
</svg>
